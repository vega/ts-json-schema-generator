name: CI

on:
  push:
    branches:
      - next
  pull_request:
    branches:
      - next

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  test:
    # name: Test ${{ matrix.shard }}/4 (${{ matrix.os }})
    name: Test (${{ matrix.os }})
    needs: build

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
      #   shard: [1, 2, 3, 4]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test coverage
        run: npm run test:coverage
        # env:
          # NODE_OPTIONS: "--test-shard=${{ matrix.shard }}/4"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
